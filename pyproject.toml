[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generador-video-pipeline"
version = "0.1.0"
description = "Local API for restrained image-to-video camera and effect animation."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "Pillow>=10.4,<13",
  "numpy>=1.26,<3",
  "imageio-ffmpeg>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
