[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generador-video-pipeline"
version = "0.1.0"
description = "Local API for motion transfer from a guide video onto a still image."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "Pillow>=10.4,<13",
  "numpy>=1.26,<3",
  "imageio-ffmpeg>=0.5,<1",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
test = [
  "httpx2>=2,<3",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/animavideo/main.py" = ["B008"]

[tool.setuptools.packages.find]
where = ["src"]
